  <!-- Structured Data - Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ReferralHub",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Referral management platform for social workers. Search verified community resources, track referrals, and follow up on client outcomes across Australia and the United States.",
    "url": "https://referralhub.com.au",
    "offers": {
      "@type": "Offer",
      "price": "15.00",
      "priceCurrency": "AUD",
      "priceValidUntil": "2027-12-31",
      "availability": "https://schema.org/InStock"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "1247",
      "bestRating": "5"
    },
    "featureList": [
      "Verified resource directory with 20,000+ community services",
      "Real-time referral tracking and follow-ups",
      "Privacy-first design with no sensitive client data stored",
      "Coverage across Australia and the United States",
      "Weekly resource verification by our team",
      "Export referral reports in PDF and CSV"
    ]
  }
  </script>

  <!-- Structured Data - FAQ (helps with Google rich snippets) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "How much does ReferralHub cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ReferralHub costs $15 per month per social worker. There is one plan with everything included. No tiers, no hidden fees. We offer a free 14-day trial with no credit card required."
        }
      },
      {
        "@type": "Question",
        "name": "Does ReferralHub store client data?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. ReferralHub is privacy-first by design. Referrals use only initials or first names and are linked to resources, not full client records. No sensitive personal information is stored on our servers."
        }
      },
      {
        "@type": "Question",
        "name": "How often is the resource directory updated?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Our team verifies every resource weekly. We check availability, contact details, wait times, and service offerings. Social workers can also flag outdated information directly in the app, and our team reviews updates within 24 hours."
        }
      },
      {
        "@type": "Question",
        "name": "What countries does ReferralHub cover?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ReferralHub currently covers community resources across Australia and the United States, with over 20,000 verified services including mental health, housing, food relief, legal aid, employment, domestic violence support, aged care, and youth services."
        }
      }
    ]
  }
  </script>
